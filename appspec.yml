version: 0.0
os: linux

file_exists_behavior: OVERWRITE

files:
  - source: /
    destination: /var/www/html

hooks:
  ApplicationStop:
    - location: scripts/stop_server
      runas: root

  BeforeInstall:
    - location: scripts/install_dependencies
      runas: root

  ApplicationStart:
    - location: scripts/start_server
      runas: root
