---
# vars file for maven-role

maven_version: "3.9.11"
maven_download_url: "https://dlcdn.apache.org/maven/maven-3/{{ maven_version }}/binaries/apache-maven-{{ maven_version }}-bin.tar.gz"
maven_archive: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
maven_extract_dir: "/opt/apache-maven-{{ maven_version }}"
maven_symlink_dir: "/opt/maven"
maven_profile_script: "/etc/profile.d/maven.sh"
