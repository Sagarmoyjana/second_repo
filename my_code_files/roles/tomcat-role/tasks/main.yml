---
# tasks file for tomcat-role

- name: Ensure apt cache is up to date
  apt:
    update_cache: yes

- name: Install Java JDK
  apt:
    name: "{{ java_package }}"
    state: present

- name: Create tomcat group
  group:
    name: "{{ tomcat_group }}"
    state: present

- name: Create tomcat user
  user:
    name: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    home: "{{ tomcat_install_dir }}"
    shell: /bin/false
    create_home: no
    system: yes
    state: present

- name: Create tomcat installation directory
  file:
    path: "{{ tomcat_install_dir }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"

- name: Download tomcat archive
  get_url:
    url: "{{ tomcat_download_url }}"
    dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    mode: "0644"

- name: Extract tomcat archive into installation directory
  unarchive:
    src: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: "{{ tomcat_install_dir }}"
    extra_opts:
      - --strip-components=1
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    remote_src: yes
  notify:
    - restart tomcat
    - start tomcat

- name: Ensure tomcat bin scripts are executable
  file:
    path: "{{ tomcat_install_dir }}/bin"
    recurse: yes
    mode: "0755"
  notify:
    - restart tomcat


- name: Create systemd unit file for tomcat
  copy:
    dest: /etc/systemd/system/tomcat.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Tomcat Web Application Container
      After=network.target

      [Service]
      Type=Forking

      User={{ tomcat_user }}
      Group={{ tomcat_group }}
      UMask=0007

      Environment= "JAVA_HOME={{ java_home }}"
      Environment= "CATALINA_HOME={{ tomcat_install_dir }}"
      Environment= "CATALINA_BASE={{ tomcat_install_dir }}"
      Environment= "CATALINA_PID={{ tomcat_install_dir }}/temp/tomcat.pid"
      Environment= "CATALINA_OPTS=-Xms512M -Xmx1024M -server -XX:+UseParallelGC"
      Environment= "JAVA_OPTS=-Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"

      ExecStart={{ tomcat_install_dir }}/bin/startup.sh
      ExecStop={{ tomcat_install_dir }}/bin/shutdown.sh

      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart tomcat

- name: Ensure Tomcat service is enabled and started
  systemd:
    name: tomcat
    enabled: yes
    state: started















